# 非 RSS collector 的来源策略。它们不会被 RSS loader 当作 feed 拉取。
source_policies:
  taptap:
    source: taptap
    tier: fast_news
    retention_hours: 24
    quality_weight: 2.5
    filter_profile: strict
    max_selected_per_digest: 2
  huggingface:
    source: huggingface
    tier: deep
    retention_hours: 72
    quality_weight: 4.0
    filter_profile: lenient

# relevance_rules 为可选的顶层配置。strict 来源需至少两个独立正向信号。
# 未配置时使用代码内置完整词表；若配置某字段，会整体覆盖该字段。
